[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project]
name = "garmin-mcp"
version = "0.1.0"
description = "MCP server to access Garmin data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv==1.0.1",
    "garminconnect==0.2.25",
    "requests==2.32.3",
    "mcp>=1.4.0,<2.0.0",
    "garth==0.5.2",
]

[project.scripts]
garmin-mcp = "garmin_mcp:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
# test_garmin.py and test_mcp_debug.py are manual scripts that need live Garmin
# credentials; only the offline suites run by default.
addopts = "--ignore=tests/test_garmin.py --ignore=tests/test_mcp_debug.py --ignore=test_mcp_server.py"

[tool.uv.sources]
garmin-mcp = { workspace = true }
